<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0f1c">
<title>Administration · Mana Orbit</title>
<!-- Panneau d'administration (proxy.mjs › /api/admin) : cette page ne contient AUCUNE donnée. Elle connecte le compte (SDK Firebase, comme l'appli)
     puis demande les statistiques au serveur, qui vérifie à chaque appel que c'est le compte de l'éditeur. Pas reliée depuis l'appli, jamais indexée. -->
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="/admin/app.css">
<script src="/admin/app.js"></script>
</head>
<body>
<div class="foil"></div>
<div class="chrome" id="chrome">
<header class="top">
  <div class="brand"><img src="/icons/icon.svg" alt="" width="30" height="30"><b>Mana Orbit</b><span class="pill">Admin</span></div>
  <div class="acts" id="acts" hidden>
    <button class="btn ghost small" id="btnRefresh" type="button" title="Recalculer les statistiques (une fois par minute au plus)">Rafraîchir</button>
  </div>
</header>
<!-- Une partie du panneau par onglet ; l'onglet est dans l'adresse (#discord…) : retour, rechargement et lien direct. Onglet sans objet (section coupée sur le serveur) masqué. -->
<nav class="tabs" id="tabs" aria-label="Parties du panneau" hidden>
  <div class="tabl" id="tabl" role="tablist" aria-label="Parties du panneau">
    <button class="tab" id="t-apercu" type="button" role="tab" aria-controls="p-apercu" data-tab="apercu">Vue d'ensemble</button>
    <button class="tab" id="t-comptes" type="button" role="tab" aria-controls="p-comptes" data-tab="comptes">Utilisateurs</button>
    <button class="tab" id="t-mystere" type="button" role="tab" aria-controls="p-mystere" data-tab="mystere">Carte mystère<span class="badge" hidden></span></button>
    <button class="tab" id="t-discord" type="button" role="tab" aria-controls="p-discord" data-tab="discord">Discord</button>
    <button class="tab" id="t-fils" type="button" role="tab" aria-controls="p-fils" data-tab="fils">Fils<span class="badge" hidden></span></button>
    <button class="tab" id="t-qr" type="button" role="tab" aria-controls="p-qr" data-tab="qr">QR codes</button>
    <button class="tab" id="t-signalements" type="button" role="tab" aria-controls="p-signalements" data-tab="signalements">Signalements<span class="badge" hidden></span></button>
    <button class="tab" id="t-journal" type="button" role="tab" aria-controls="p-journal" data-tab="journal">Journal</button>
    <button class="tab" id="t-serveur" type="button" role="tab" aria-controls="p-serveur" data-tab="serveur">Serveur<span class="badge warn" hidden></span></button>
  </div>
</nav>
</div>
<main>
  <section class="state" id="vLoad"><span class="spin" aria-hidden="true"></span><p>Chargement…</p></section>
  <section class="state" id="vOut" hidden>
    <h1>Administration</h1>
    <p>Connecte-toi avec le compte de l'éditeur.</p>
    <button class="btn main" id="btnIn" type="button">Se connecter avec Google</button>
    <p class="hint">Déjà connecté dans l'appli sur ce navigateur ? Tu l'es aussi ici.</p>
    <p class="err" id="inErr" hidden></p>
  </section>
  <section class="state" id="vDeny" hidden>
    <h1>Accès réservé</h1>
    <button class="btn ghost" id="btnSwitch" type="button">Changer de compte</button>
  </section>
  <section class="state" id="vErr" hidden>
    <h1>Indisponible</h1>
    <p id="errTxt"></p>
    <button class="btn ghost" id="btnRetry" type="button">Réessayer</button>
  </section>
  <section id="vMain" hidden>
    <p class="meta" id="meta"></p>
    <section class="panel" id="p-apercu" role="tabpanel" aria-labelledby="t-apercu" tabindex="-1">
      <div id="notes"></div>
      <div class="kpis" id="kpis"></div>
      <div class="duo">
        <section class="card" id="chart"></section>
        <section class="card" id="achart"></section>
      </div>
      <section class="card" id="mix"></section>
    </section>
    <section class="panel" id="p-comptes" role="tabpanel" aria-labelledby="t-comptes" tabindex="-1" hidden>
      <section class="card users">
        <div class="uhead">
          <h2>Utilisateurs <small id="uCount"></small></h2>
          <div class="ctl">
            <input id="q" type="search" placeholder="Rechercher…" autocomplete="off" spellcheck="false" aria-label="Rechercher un nom">
            <select id="sort" aria-label="Trier par">
              <option value="created">Inscription</option>
              <option value="login">Connexion</option>
              <option value="seen">Activité</option>
              <option value="cards">Cartes</option>
              <option value="decks">Decks</option>
            </select>
            <button class="btn ghost small dir" id="dir" type="button" aria-label="Ordre du tri">↓</button>
            <button class="btn ghost small" id="btnCsv" type="button" title="Télécharger la liste en CSV : mêmes champs réduits, tri et recherche en cours">CSV</button>
          </div>
        </div>
        <div class="ulist" id="ulist"></div>
        <nav class="pager" id="pager" aria-label="Pages"></nav>
      </section>
    </section>
    <section class="panel" id="p-mystere" role="tabpanel" aria-labelledby="t-mystere" tabindex="-1" hidden>
      <section class="card" id="daily"></section>
    </section>
    <section class="panel" id="p-discord" role="tabpanel" aria-labelledby="t-discord" tabindex="-1" hidden>
      <div id="discord"></div>
    </section>
    <section class="panel" id="p-fils" role="tabpanel" aria-labelledby="t-fils" tabindex="-1" hidden>
      <div id="threads"></div>
    </section>
    <section class="panel" id="p-qr" role="tabpanel" aria-labelledby="t-qr" tabindex="-1" hidden>
      <div id="qrcodes"></div>
    </section>
    <section class="panel" id="p-signalements" role="tabpanel" aria-labelledby="t-signalements" tabindex="-1" hidden>
      <section class="card" id="dyRepCard" hidden></section>
      <section class="card" id="pubrep"></section>
      <section class="card" id="scans" hidden></section>
    </section>
    <section class="panel" id="p-journal" role="tabpanel" aria-labelledby="t-journal" tabindex="-1" hidden>
      <section class="card" id="journal"></section>
    </section>
    <section class="panel" id="p-serveur" role="tabpanel" aria-labelledby="t-serveur" tabindex="-1" hidden>
      <section class="card" id="srv"></section>
    </section>
    <div class="foot"><button class="btn ghost small" id="btnOut" type="button" title="Déconnecte aussi l'appli dans ce navigateur">Se déconnecter</button></div>
  </section>
</main>
<dialog class="dlg" id="dlg" aria-labelledby="dlgT"></dialog>
</body>
</html>
