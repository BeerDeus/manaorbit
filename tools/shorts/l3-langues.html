<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>l3-langues · Le scan lit tes cartes en 11 langues</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="lancement.css">
<!-- Sans voix (musique ajoutée dans l'appli au moment de publier) : sous-titres écrits, instants en secondes -->
<script>window.DUREE = 11.8; window.COUVERTURE = 3.2;
  window.SOUS_TITRES = [[0.15, 2.2, 'Ta carte est en <em>japonais</em>&nbsp;?'], [2.2, 3.45, 'Le scan la lit quand même'], [3.45, 6.9, 'Allemand, russe, italien…'], [6.9, 9.25, '<em>11 langues</em>, chinois et coréen compris']];</script>
<style>
  .langue{position:absolute;left:0;right:0;top:560px;z-index:36;text-align:center;animation:pop .4s var(--ressort) var(--in) both,fondu .15s linear var(--out) forwards}
  .langue span{display:inline-flex;align-items:center;gap:18px;padding:20px 38px;border-radius:999px;background:rgba(19,26,43,.95);border:2px solid var(--line);font-family:Bricolage;font-weight:750;font-size:46px;letter-spacing:-.02em;box-shadow:0 24px 50px -18px rgba(0,0,0,.9);rotate:-2deg}
  .langue b{color:var(--warm)}
  .onze{position:absolute;left:0;right:0;top:620px;z-index:36;text-align:center;animation:pop .5s var(--ressort) var(--in) both}
  .onze div{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:14px;width:900px}
  .onze span{padding:14px 26px;border-radius:999px;background:rgba(19,26,43,.96);border:2px solid var(--line);font-weight:700;font-size:36px;animation:pop .35s var(--ressort) var(--in) both}
  .onze span.a{border-color:var(--warm);color:var(--warm)}
  .couvt{display:none}
  .couv .couvt{display:block;top:240px}
  .couv .st,.couv .langue{display:none}
</style>
</head>
<body>
<div class="scene">
  <div class="bg"></div>
  <div class="halo" style="--y:1100px"></div>
  <div class="orbite" data-rx="600" data-ry="150" data-mana="WUBRG" style="--y:1560px;--tour:16s;--deg:-10deg"></div>

  <div class="tel2 flotte" style="--in:0s;--out:6.95s">
    <div class="vue">
      <div class="ecr zoom" style="--in:0s;--zin:.9s;--z:1.3;--ox:0%;--oy:100%">
        <div class="ecr" data-src="scan-0" style="--in:0s"></div>
        <div class="ecr" data-src="scan-2" style="--in:2.2s"></div>
        <div class="ecr" data-src="scan-3" style="--in:3.45s"></div>
        <div class="ecr" data-src="scan-4" style="--in:4.6s"></div>
        <div class="ecr" data-src="scan-5" style="--in:5.75s"></div>
      </div>
      <div class="tap" style="--in:1.9s;--x:65%;--y:91%"></div>
      <div class="tap" style="--in:3.15s;--x:65%;--y:91%"></div>
      <div class="tap" style="--in:4.3s;--x:65%;--y:91%"></div>
      <div class="tap" style="--in:5.45s;--x:65%;--y:91%"></div>
    </div>
  </div>
  <div class="langue" style="--in:2.25s;--out:3.45s"><span><b>Japonais</b> · Cyclonic Rift</span></div>
  <div class="langue" style="--in:3.5s;--out:4.6s"><span><b>Allemand</b> · Vampiric Tutor</span></div>
  <div class="langue" style="--in:4.65s;--out:5.75s"><span><b>Russe</b> · Teferi's Protection</span></div>
  <div class="langue" style="--in:5.8s;--out:6.9s"><span><b>Italien</b> · Rhystic Study</span></div>
  <div class="onze" style="--in:7s"><div>
    <span style="--in:7.05s">Français</span><span style="--in:7.12s">Anglais</span><span style="--in:7.19s">Allemand</span><span style="--in:7.26s">Espagnol</span><span style="--in:7.33s">Italien</span><span style="--in:7.4s">Portugais</span>
    <span style="--in:7.47s">Russe</span><span class="a" style="--in:7.54s">Japonais</span><span class="a" style="--in:7.61s">Coréen</span><span class="a" style="--in:7.68s">Chinois simplifié</span><span class="a" style="--in:7.75s">Chinois traditionnel</span></div></div>

  <div class="titre couvt">Ta carte est en<br><em>japonais</em>&nbsp;?<small>Le scan la lit quand même</small></div>
  <div class="fin" style="--in:9.25s"></div>
</div>
<script src="base.js"></script>
<script src="lancement.js"></script>
</body>
</html>
