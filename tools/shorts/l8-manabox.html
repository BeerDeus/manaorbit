<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>l8-manabox · Passer de ManaBox à Mana Orbit</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="lancement.css">
<script>window.APRES_VOIX = 3.45; window.DECALAGE_VOIX = 0.3; window.COUVERTURE = 'fichier+0.12';</script>
<style>
  .de-a{position:absolute;left:0;right:0;top:760px;z-index:20;text-align:center;animation:pop .5s var(--ressort) var(--in) both,fondu .25s linear var(--out) forwards}
  .de-a span{display:inline-block;padding:24px 46px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-family:Bricolage;font-weight:800;font-size:70px;letter-spacing:-.03em;box-shadow:0 30px 70px -20px rgba(0,0,0,.95)}
  .de-a span.nous{background:var(--accent);color:#0b0f1c;border-color:var(--accent)}
  .de-a i{display:block;font-style:normal;font-family:Bricolage;font-weight:800;font-size:110px;color:var(--accent);line-height:1.1}
  /* fichier CSV qui tombe dans le téléphone */
  .csv{position:absolute;left:350px;top:700px;width:380px;height:480px;z-index:30;border-radius:26px;background:#f4f6fb;color:#0b0f1c;box-shadow:0 40px 80px -20px rgba(0,0,0,.95);overflow:hidden;
    animation:pop .45s var(--ressort) var(--in) both,chute .55s cubic-bezier(.5,0,.75,0) var(--out) forwards;rotate:-6deg}
  .csv::before{content:"";position:absolute;right:0;top:0;width:90px;height:90px;background:linear-gradient(225deg,#0b0f1c 50%,#cfd5e6 50%)}
  .csv b{position:absolute;left:36px;top:40px;padding:8px 18px;border-radius:12px;background:#6fd08c;font-family:Bricolage;font-weight:800;font-size:40px}
  .csv pre{position:absolute;left:36px;right:30px;top:130px;font-family:'JetBrains Mono',monospace;font-size:20px;line-height:1.75;color:#3a4366;white-space:pre;overflow:hidden}
  .csv small{position:absolute;left:36px;bottom:30px;font-size:30px;font-weight:700}
  @keyframes chute{to{translate:0 560px;scale:.35;opacity:0;rotate:0deg}}
  .coches{position:absolute;left:150px;top:560px;z-index:36;display:flex;gap:16px}
  .coches .pastille{position:static;animation:pop .4s var(--ressort) var(--in) both}
  .couvt{display:none}
  .couv .couvt{display:block;top:230px}
  .couv .st{display:none}
</style>
</head>
<body>
<div class="scene">
  <div class="bg"></div>
  <div class="halo" style="--y:1100px"></div>
  <div class="orbite" data-rx="600" data-ry="150" data-mana="WUBRG" style="--y:1560px;--tour:16s;--deg:-10deg"></div>

  <div class="de-a" style="--in:.1s" data-out="exporte-0.15"><span>ManaBox</span><i>↓</i><span class="nous">Mana Orbit</span></div>
  <div class="csv" data-in="exporte-0.05" data-out="fichier"><b>CSV</b>
    <pre>Name,Set code,Quantity,Language
Sol Ring,CMM,1,fr
Cyclonic Rift,RTR,1,ja
Vampiric Tutor,EMA,1,de
Rhystic Study,JMP,2,it
Edgar Markov,C17,1,en
…</pre><small>collection.csv</small></div>

  <div class="tel2 flotte" data-in="importe-0.25">
    <div class="vue">
      <div class="ecr" data-src="manabox" style="--in:0s"></div>
      <div class="tap" data-in="dans" style="--x:67%;--y:94%"></div>
      <div class="ecr monte2 zoom" data-src="collection" data-in="fait-0.25" data-zin="quantites-0.2" style="--z:1.35;--ox:100%;--oy:78%"></div>
    </div>
  </div>
  <div class="pastille ok" data-in="fait-0.1" data-out="tes-0.1" style="left:250px;top:560px;rotate:-2deg;animation:pop .45s var(--ressort) var(--in) both,fondu .2s linear var(--out) forwards"><b>✓</b> 505 cartes importées</div>
  <div class="coches"><div class="pastille ok" data-in="cartes"><b>✓</b> cartes</div><div class="pastille ok" data-in="quantites"><b>✓</b> quantités</div><div class="pastille ok" data-in="langues"><b>✓</b> langues</div></div>

  <div class="titre couvt">Tu viens de <em>ManaBox</em> ?<br><small>Ta collection te suit en 2 minutes</small></div>
  <div class="fin" data-in="perd>+0.8"></div>
</div>
<script src="base.js"></script>
<script src="lancement.js"></script>
</body>
</html>
