<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>l2-classeur · Combien vaut ton classeur ?</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="lancement.css">
<script>window.DUREE = 12.4; window.DECALAGE_VOIX = 0.3; window.COUVERTURE = 7.6;</script>
<style>
  .valeur{position:absolute;left:110px;width:860px;top:640px;z-index:36;padding:34px 44px;border-radius:40px;background:rgba(19,26,43,.94);border:2px solid var(--line);box-shadow:0 0 0 3px rgba(146,156,255,.4),0 40px 90px -20px rgba(0,0,0,.95);
    animation:loupe .5s var(--ressort) var(--in) both,fondu .25s linear var(--out) forwards;rotate:-2deg}
  .valeur small{display:block;font-size:34px;font-weight:600;color:var(--ink-2)}
  .valeur b{display:block;margin-top:6px;font-family:Bricolage;font-weight:800;font-size:132px;letter-spacing:-.05em;line-height:1;white-space:nowrap;background:linear-gradient(100deg,var(--rose),var(--warm) 45%,var(--menthe));-webkit-background-clip:text;color:transparent}
  .valeur span{display:inline-block;margin-top:14px;font-size:32px;color:var(--ink-3)}
  .mystere{position:absolute;left:0;right:0;top:700px;text-align:center;z-index:36;animation:pop .45s var(--ressort) var(--in) both,fondu .2s linear var(--out) forwards}
  .mystere b{display:inline-block;padding:26px 56px;border-radius:999px;background:rgba(19,26,43,.94);border:2px solid var(--line);font-family:Bricolage;font-weight:800;font-size:120px;letter-spacing:-.04em;color:var(--warm);rotate:3deg;box-shadow:0 30px 70px -20px rgba(0,0,0,.95)}
  .couvt{display:none}
  .couv .couvt{display:block;top:230px}
  .couv .st{display:none}
</style>
</head>
<body>
<div class="scene">
  <div class="bg"></div>
  <div class="halo" style="--y:1150px"></div>
  <div class="orbite" data-rx="600" data-ry="150" data-mana="WUBRG" style="--y:1560px;--tour:16s;--deg:-10deg"></div>

  <div class="tel2 flotte" style="--in:0s">
    <div class="vue">
      <div class="ecr" data-src="classeur" style="--in:0s"></div>
      <div class="ecr pousse zoom" data-in="scanne-0.12" data-zin="cartes>-0.1" style="--z:1.22;--ox:0%;--oy:46%">
        <div class="ecr" data-src="scan-0" style="--in:0s"></div>
        <div class="ecr" data-src="scan-1" data-in="mana"></div>
        <div class="ecr" data-src="scan-2" data-in="orbit"></div>
        <div class="ecr" data-src="scan-3" data-in="les"></div>
        <div class="ecr" data-src="scan-4" data-in="reconnait"></div>
        <div class="ecr" data-src="scan-5" data-in="reconnait+0.25"></div>
        <div class="ecr" data-src="scan-6" data-in="et"></div>
      </div>
      <div class="ecr pousse" data-src="collection" data-in="donne-0.15"></div>
      <div class="ecr pousse zoom" data-src="valeur" data-in="chaque-0.2" data-zin="jour" style="--z:1.12;--ox:50%;--oy:100%"></div>
      <div class="tap" data-in="scanne+0.3" style="--x:50%;--y:93%"></div>
    </div>
  </div>

  <div class="mystere" data-in="combien" data-out="scanne-0.1"><b>??? €</b></div>
  <div class="valeur" data-in="cote-0.1" data-out="chaque-0.25"><small>Ma collection · cote Cardmarket</small><b class="compte" data-in="cote" data-a="2325.89" data-dec="2" data-duree="1.1" data-suffixe=" €">0</b><span>505 cartes · 1 019 exemplaires</span></div>
  <div class="pastille ok" data-in="monte-0.15" style="left:270px;top:560px;rotate:-3deg;animation:pop .45s var(--ressort) var(--in) both"><b>▲ +86 €</b> cette semaine</div>

  <div class="titre couvt">Combien vaut ton classeur <em>Magic</em>&nbsp;?</div>
  <div class="fin" data-in="monte>+0.7"></div>
</div>
<script src="base.js"></script>
<script src="lancement.js"></script>
</body>
</html>
