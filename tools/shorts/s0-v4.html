<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>s0-v4 · J-5 : on cherche 12 testeurs</title>
<link rel="stylesheet" href="base.css">
<script>window.DUREE = 10.5; window.DECALAGE_VOIX = 0.4;</script>
<!-- Phrases : 1 « Dans cinq jours, Mana Orbit ouvre ses portes à ses premiers testeurs. » 0,4-3,75 · 2 « On cherche douze joueurs… avant tout le monde. » 4,15-6,8 · 3 « Le lien est en bio. » 7,3-8,2 -->
</head>
<body>
<div class="scene">
  <div class="bg"></div>
  <div class="orbit"><i></i></div><div class="orbit b"><i></i></div>

  <section class="ecran" style="--in:.05s;--out:4s">
    <div class="compteur pop" style="--in:.1s">J-5<small>avant l'ouverture du test</small></div>
    <h1 class="monte" style="--in:1.3s;margin-top:70px">Mana Orbit ouvre ses portes aux <em>premiers testeurs</em></h1>
    <div class="monte" style="--in:2.6s;margin-top:50px"><span class="date">lundi 19 octobre</span></div>
  </section>

  <section class="ecran" style="--in:4.15s;--out:7.15s">
    <h1>On cherche <em>12 joueurs</em> de Magic</h1>
    <p class="monte" style="--in:5.6s;margin-top:40px;font-size:50px;font-weight:500;color:var(--ink-2)">pour l'essayer avant tout le monde.</p>
    <div class="ill" style="top:520px">
      <div class="places">
        <div class="place pop" style="--in:4.4s">1</div><div class="place pop" style="--in:4.5s">2</div><div class="place pop" style="--in:4.6s">3</div><div class="place pop" style="--in:4.7s">4</div>
        <div class="place pop" style="--in:4.8s">5</div><div class="place pop" style="--in:4.9s">6</div><div class="place pop" style="--in:5s">7</div><div class="place pop" style="--in:5.1s">8</div>
        <div class="place pop" style="--in:5.2s">9</div><div class="place pop" style="--in:5.3s">10</div><div class="place pop" style="--in:5.4s">11</div><div class="place toi pop" style="--in:6.1s">toi ?</div>
      </div>
    </div>
  </section>

  <section class="marque" style="top:430px"><div class="logo" style="--in:7.3s"><svg viewBox="0 0 512 512"><use href="#logo"/></svg></div>
    <h1 class="monte" style="--in:7.5s">Mana Orbit</h1><p class="monte" style="--in:7.9s">Test fermé · <b>12 places</b> · 19 octobre</p></section>
  <div class="cta monte" style="--in:7.4s;top:1300px"><span>Le lien est en bio ↑</span><small>Deviens testeur en 3 étapes</small></div>
</div>
<script src="base.js"></script>
