# Base de l'assistant de deck Commander (coach, src/deckwiz.js) : corpus de decks réels (Archidekt, les plus vus), pages commandant et thèmes EDHREC,
# rôle de chaque carte (catégories Archidekt, Scryfall Tagger, texte), cibles par catégorie et cartes conseillées (gen-deckdb.mjs).
# Chaque nuit ; le corpus du passage précédent est repris (incrémental : ce qui manque ou a vieilli est relu dans le budget de temps).
# Publié sur la branche « deck-corpus » (un seul commit, réécrit à chaque passage : pas d'historique qui gonfle le dépôt) :
#   corpus.json.gz (base brute, reste sur GitHub), dkw.json.gz (agrégats relus par le serveur toutes les 6 h : server/dkw-srv.mjs), log.txt.
# Lancement manuel : onglet Actions › « Base du coach » › Run workflow (minutes = budget du passage).
name: Base du coach
on:
  schedule:
    - cron: '13 1 * * *'      # se termine avant « Commandants EDHREC » (lundi et jeudi 4 h 41) : jamais deux lectures d'Archidekt en même temps
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Budget du passage (minutes)'
        default: '190'
permissions:
  contents: write
concurrency:
  group: deckdb
  cancel-in-progress: false
jobs:
  deckdb:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Corpus du passage précédent (branche deck-corpus)
        run: |
          mkdir -p out
          (git fetch -q --depth 1 origin deck-corpus && git show FETCH_HEAD:corpus.json.gz > out/corpus.json.gz) || { rm -f out/corpus.json.gz; echo "pas encore de corpus : il commence aujourd'hui"; }
      - name: Générer corpus.json.gz et dkw.json.gz
        env:
          DECKDB_MIN: ${{ inputs.minutes || '190' }}
        run: node --max-old-space-size=6144 gen-deckdb.mjs out 2>&1 | tail -n 400; exit ${PIPESTATUS[0]}
      - name: Erreur (dernières lignes du journal en annotation)
        if: failure()
        run: echo "::error title=gen-deckdb::$(tail -c 900 out/log.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/ | /g')"
      - name: Publier sur la branche deck-corpus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          printf '%s\n' "# Base du coach (générée)" "" "Branche écrite par .github/workflows/deckdb.yml (gen-deckdb.mjs) : ne pas modifier à la main." "" "- corpus.json.gz : base brute (decks Archidekt, pages EDHREC, étiquettes des cartes)" "- dkw.json.gz : agrégats relus par le serveur (server/dkw-srv.mjs)" "- log.txt : journal du dernier passage" > README.md
          git init -q && git checkout -q -b deck-corpus
          git config user.name "deck-deal-bot"
          git config user.email "deck-deal-bot@users.noreply.github.com"
          git add README.md corpus.json.gz dkw.json.gz log.txt && git commit -qm "Base du coach : $(date -u +%F)"
          for i in 1 2 3; do git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deck-corpus && exit 0; sleep $((i * 10)); done; exit 1
