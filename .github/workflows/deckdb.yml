# Base de l'assistant de deck Commander (coach, src/deckwiz.js) : corpus de decks réels (Archidekt, les plus vus), pages commandant et thèmes EDHREC,
# rôle de chaque carte (catégories Archidekt, Scryfall Tagger, texte), cibles par catégorie et cartes conseillées (gen-deckdb.mjs).
# Chaque nuit à 1 h 13 UTC (passage de 5 h 20 : environ 18 000 decks Archidekt de plus, pages suivantes des commandants les plus joués ; toutes les 6 h du 2 au 4 novembre 2026, jusqu'à 150 000 decks) ;
# le corpus du passage précédent est repris (incrémental). Chaque passage finit par l'analyse : agrégats, paires de cartes, banc d'essai et réglage
# des poids du coach (bench-coach.mjs). Dépôt public : minutes d'Actions gratuites, 6 h au plus par passage.
# Publié sur la branche « deck-corpus » (un seul commit, réécrit à chaque passage : pas d'historique qui gonfle le dépôt) :
#   corpus.json.gz et decks-<n>.json.gz (base brute, reste sur GitHub, 60 000 decks par fichier), dkw.json.gz (agrégats relus par le serveur toutes les 6 h : server/dkw-srv.mjs), log.txt.
# Lancement manuel : onglet Actions › « Base du coach » › Run workflow (minutes = budget du passage).
name: Base du coach
on:
  schedule:
    - cron: '13 1 * * *'      # file d'attente « archidekt » partagée avec « Commandants EDHREC » (edhrec.yml) : jamais deux lectures d'Archidekt en même temps
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Budget du passage (minutes)'
        default: '320'
permissions:
  contents: write
concurrency:
  group: archidekt
  cancel-in-progress: false
jobs:
  deckdb:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Corpus du passage précédent (branche deck-corpus)
        run: |
          mkdir -p out
          if git fetch -q --depth 1 origin deck-corpus; then
            for f in $(git ls-tree --name-only FETCH_HEAD | grep -E '^(corpus|decks-[0-9]+)\.json\.gz$'); do git show "FETCH_HEAD:$f" > "out/$f"; done
          else echo "pas encore de corpus : il commence aujourd'hui"; fi
      - name: Générer corpus.json.gz et dkw.json.gz
        env:
          DECKDB_MIN: ${{ inputs.minutes || '320' }}
        run: node --max-old-space-size=6144 gen-deckdb.mjs out 2>&1 | tail -n 400; exit ${PIPESTATUS[0]}
      - name: Erreur (dernières lignes du journal en annotation)
        if: failure()
        run: echo "::error title=gen-deckdb::$(tail -c 900 out/log.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/ | /g')"
      - name: Publier sur la branche deck-corpus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          printf '%s\n' "# Base du coach (générée)" "" "Branche écrite par .github/workflows/deckdb.yml (gen-deckdb.mjs) : ne pas modifier à la main." "" "- corpus.json.gz : base brute (decks Archidekt, pages EDHREC, étiquettes des cartes)" "- dkw.json.gz : agrégats relus par le serveur (server/dkw-srv.mjs)" "- log.txt : journal du dernier passage" > README.md
          git init -q && git checkout -q -b deck-corpus
          git config user.name "deck-deal-bot"
          git config user.email "deck-deal-bot@users.noreply.github.com"
          git add README.md corpus.json.gz decks-*.json.gz dkw.json.gz log.txt && git commit -qm "Base du coach : $(date -u +%F)"
          for i in 1 2 3; do git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deck-corpus && exit 0; sleep $((i * 10)); done; exit 1
