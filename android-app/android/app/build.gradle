apply plugin: 'com.android.application'

android {
    namespace = "app.manaorbit"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.manaorbit"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "1.0.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            // R8 (APK 1.0.7) : code réduit et obscurci, exigé par la Play Console (« optimisation du code DEX », seuil de 25 %, d'ici février 2027).
            // Règles : celles de capacitor-android et de chaque bibliothèque (consumerProguardFiles), plus proguard-rules.pro. Le fichier de correspondance
            // (traces de plantage lisibles) part dans l'.aab. shrinkResources laissé à false : des ressources sont lues par leur nom (google_app_id…).
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"      // EdgeToEdge (MainActivity, APK 1.0.7)
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Scan (ManaOrbitPlugin.detectText) : ML Kit chinois, japonais, coréen, et latin (le même modèle que le plugin ML Kit, déjà dans l'appli). Versions « services Google Play »
    // (non embarquées) : ≈ 260 Ko par écriture dans l'appli au lieu de ≈ 4 Mo, modèle téléchargé par le téléphone à la première carte de cette écriture (docs/android.md).
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.1'
    // Demande de note Google Play dans l'appli (ManaOrbitPlugin.requestReview, In-App Review)
    implementation 'com.google.android.play:review:2.0.2'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Firebase (connexion Google, notifications) : google-services.json est OBLIGATOIRE, sinon l'appli se fermerait au lancement.
// À télécharger depuis la console Firebase (projet m2s-mtg › Ajouter une appli Android « app.manaorbit ») et à placer dans android/app/ (voir docs/android.md).
// Absent : la synchro, « clean » et « signingReport » (pour obtenir le SHA-1) marchent ; seule la compilation de l'appli s'arrête, avec ce message.
def servicesJSON = file('google-services.json')
if (servicesJSON.exists() && servicesJSON.text) {
    apply plugin: 'com.google.gms.google-services'
} else {
    tasks.configureEach { t ->
        if (t.name == 'preBuild') t.doFirst { throw new GradleException("google-services.json manquant dans android/app/ : télécharge-le depuis la console Firebase (voir docs/android.md, section 2 bis).") }
    }
}
